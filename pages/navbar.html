<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barre de navigation</title>
    <style>
        :root {
            --brand: #2563eb;
            --brand-dark: #1d4ed8;
            --ink: #101828;
            --muted: #667085;
            --surface: #f6f8fc;
            --footer: #0b1220;
        }

        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
        section { scroll-margin-top: 80px; }
        .navbar { background: rgba(11, 18, 32, .97); }
        .navbar-brand { display: inline-flex; align-items: center; gap: .65rem; font-weight: 800; letter-spacing: .02em; }
        .navbar-brand img { width: 48px; height: 48px; object-fit: contain; }
        .brand-accent { color: #60a5fa; }
        .navbar .nav-link { color: #e5e7eb; padding: .7rem .9rem; }
        .navbar .nav-link:hover, .navbar .nav-link:focus { color: #93c5fd; }
        .btn { border-radius: 999px; padding: .75rem 1.25rem; font-weight: 600; }
        .btn-primary { background: var(--brand); border-color: var(--brand); }
        .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
        </style>

    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#accueil" aria-label="ISHOLA DIGITAL - Accueil">
                <img src="../assets/images/isholadigital.png" alt="Logo ISHOLA DIGITAL">
                <span><span class="brand-accent">ISHOLA</span> DIGITAL</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Ouvrir le menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html #accueil">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#pourquoi">Pourquoi nous ?</a></li>
                    <li class="nav-item ms-lg-2"><a class="btn btn-primary btn-sm mt-2 mt-lg-0" href="#contact">Contactez-nous</a></li>
                </ul>
            </div>
        </div>
    </nav>
    

    <script src="../assets/bootstrap/js/bootstrap.min.js">

    </script>
</body>
</html>
